<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <script src="https://www.paypal.com/sdk/js?client-id=AY6qu9OjnVJXXXwsqSkqpNuM1tNibNF8bh7Z2xvEpUZQSxCEZWSOkRdv50mp5DqeBItRRe0GLS9VpBIt&vault=true&intent=subscription"></script>
</head>
<body>
  <div id="paypal-button-container"></div>

  <script>
    paypal.Buttons({
      style: {
        shape: 'rect',
        color: 'gold',
        layout: 'vertical',
        label: 'subscribe'
      },
      createSubscription: function(data, actions) {
        return actions.subscription.create({
          plan_id: 'P-8EV86494EK6312239NBCUGVI'
        });
      },
      onApprove: function(data) {
        // Redirect back to the app with the subscription ID
        window.location.href = "com.am24.am24://paypalpay?subscriptionId=" + data.subscriptionID;
      },
      onCancel: function() {
        window.location.href = "com.am24.am24://paypalpay?cancel=true";
      }
    }).render('#paypal-button-container');
  </script>
</body>
</html>
